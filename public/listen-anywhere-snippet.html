<!--
  badradio listen-anywhere fragment for badradio.com (or another allowlisted host).
  Paste as HTML. The iframe is allowed from badradio.com / www.badradio.com / badradio.rocks.
  PWA install only works on badradio.rocks — the Install app link opens the listen page there.
-->
<section style="font-family:Georgia,serif;background:#080705;color:#f3ead8;border:1px solid #2a261f;padding:16px;max-width:40rem">
  <p style="font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e6a23c;margin:0 0 6px">listen anywhere</p>
  <p style="margin:0 0 12px">Put badradio on the home screen or keep this player on the page. Installs from your browser, no app store.</p>
  <p style="display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px">
    <a href="https://badradio.rocks/#listen-anywhere" style="background:#e6a23c;color:#080705;text-decoration:none;padding:8px 12px;font-family:ui-monospace,monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em">Install app</a>
    <a href="https://badradio.rocks/widget" style="border:1px solid #e6a23c;color:#e6a23c;text-decoration:none;padding:8px 12px;font-family:ui-monospace,monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em">Open the widget</a>
  </p>
  <p style="font-family:ui-monospace,monospace;font-size:11px;color:#9a8e7c;margin:0 0 8px">iPhone: Safari → Share → Add to Home Screen. Android/Desktop: Chrome or Edge → Install.</p>
  <iframe
    src="https://badradio.rocks/widget"
    title="badradio live player"
    loading="lazy"
    allow="autoplay"
    style="width:100%;height:580px;border:0;overflow:hidden;background:#080705"
  ></iframe>
</section>
